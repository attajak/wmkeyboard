<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The parts of the keyboard a theme paints</title>
  <desc id="d">A dark keyboard with numbered markers on the board, the toolbar row, the suggestion strip, a letter key and its hint, a pressed key, a bordered key, a modifier key, the enter key, the space bar and the navigation bar.</desc>
  <defs>
    <style>
      .label { fill: #E9E9EE; font-size: 17px; }
      .mod { fill: #E9E9EE; font-size: 15px; }
      .hint { fill: #E9E9EE; fill-opacity: 0.55; font-size: 9px; }
      .badge { fill: #FFD166; stroke: #1B1C20; stroke-width: 1.5; }
      .num { fill: #1B1C20; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .lead { stroke: #FFD166; stroke-width: 1.5; fill: none; }
      .cap { fill: #6B6E78; font-size: 12px; }
    </style>
  </defs>

  <!-- 1 Board -->
  <rect x="120" y="20" width="520" height="380" rx="18" fill="#17181C"/>

  <!-- 2 Toolbar row: rounded at the top with the board, square below -->
  <path d="M138 20 h484 a18 18 0 0 1 18 18 v22 h-520 v-22 a18 18 0 0 1 18 -18 z" fill="#1E2026"/>
  <g>
    <circle cx="176" cy="40" r="14" fill="#2A2C33"/>
    <rect x="169" y="33" width="14" height="14" rx="3" fill="none" stroke="#A9ABB3" stroke-width="1.6"/>
    <circle cx="258" cy="40" r="14" fill="#2A2C33"/>
    <path d="M251 40 h14 M258 33 v14" stroke="#A9ABB3" stroke-width="1.6"/>
    <circle cx="340" cy="40" r="14" fill="#4C8DF6"/>
    <path d="M334 44 l4 -8 l4 8 M335.5 41.5 h5" stroke="#0B1220" stroke-width="1.6" fill="none"/>
    <circle cx="422" cy="40" r="14" fill="#2A2C33"/>
    <path d="M415 36 h14 M415 40 h14 M415 44 h10" stroke="#A9ABB3" stroke-width="1.6"/>
    <circle cx="504" cy="40" r="14" fill="#2A2C33"/>
    <circle cx="504" cy="40" r="5" fill="none" stroke="#A9ABB3" stroke-width="1.6"/>
    <circle cx="586" cy="40" r="14" fill="#2A2C33"/>
    <path d="M580 40 l4 4 l8 -8" stroke="#A9ABB3" stroke-width="1.6" fill="none"/>
  </g>

  <!-- 3 Suggestion strip -->
  <rect x="120" y="60" width="520" height="40" fill="#22242B"/>
  <text x="207" y="86" text-anchor="middle" fill="#A9ABB3" font-size="15">the</text>
  <line x1="293" y1="70" x2="293" y2="90" stroke="#E9E9EE" stroke-opacity="0.25"/>
  <text x="380" y="87" text-anchor="middle" fill="#E9E9EE" font-size="17" font-weight="600">The</text>
  <line x1="467" y1="70" x2="467" y2="90" stroke="#E9E9EE" stroke-opacity="0.25"/>
  <text x="553" y="86" text-anchor="middle" fill="#A9ABB3" font-size="15">they</text>

  <!-- Key rows: key 44 wide, 46 tall, gap 6; rows at y = 110, 162, 214, 266 -->
  <g>
    <!-- row 1 -->
    <rect x="132" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="154" y="139" text-anchor="middle" class="label">q</text>
    <text x="171" y="121" text-anchor="end" class="hint">1</text>
    <rect x="182" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="204" y="139" text-anchor="middle" class="label">w</text>
    <text x="221" y="121" text-anchor="end" class="hint">2</text>
    <rect x="232" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="254" y="139" text-anchor="middle" class="label">e</text>
    <text x="271" y="121" text-anchor="end" class="hint">3</text>
    <rect x="282" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="304" y="139" text-anchor="middle" class="label">r</text>
    <text x="321" y="121" text-anchor="end" class="hint">4</text>
    <rect x="332" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="354" y="139" text-anchor="middle" class="label">t</text>
    <text x="371" y="121" text-anchor="end" class="hint">5</text>
    <rect x="382" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="404" y="139" text-anchor="middle" class="label">y</text>
    <text x="421" y="121" text-anchor="end" class="hint">6</text>
    <rect x="432" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="454" y="139" text-anchor="middle" class="label">u</text>
    <text x="471" y="121" text-anchor="end" class="hint">7</text>
    <rect x="482" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="504" y="139" text-anchor="middle" class="label">i</text>
    <text x="521" y="121" text-anchor="end" class="hint">8</text>
    <rect x="532" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="554" y="139" text-anchor="middle" class="label">o</text>
    <text x="571" y="121" text-anchor="end" class="hint">9</text>
    <rect x="582" y="110" width="44" height="46" rx="8" fill="#303338"/><text x="604" y="139" text-anchor="middle" class="label">p</text>
    <text x="621" y="121" text-anchor="end" class="hint">0</text>
    <!-- row 2 -->
    <rect x="157" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="179" y="191" text-anchor="middle" class="label">a</text>
    <rect x="207" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="229" y="191" text-anchor="middle" class="label">s</text>
    <rect x="257" y="162" width="44" height="46" rx="8" fill="#4A5068"/><text x="279" y="191" text-anchor="middle" class="label">d</text>
    <rect x="307" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="329" y="191" text-anchor="middle" class="label">f</text>
    <rect x="357" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="379" y="191" text-anchor="middle" class="label">g</text>
    <rect x="407" y="162" width="44" height="46" rx="8" fill="#303338" stroke="#8AB4F8" stroke-width="2"/><text x="429" y="191" text-anchor="middle" class="label">h</text>
    <rect x="457" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="479" y="191" text-anchor="middle" class="label">j</text>
    <rect x="507" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="529" y="191" text-anchor="middle" class="label">k</text>
    <rect x="557" y="162" width="44" height="46" rx="8" fill="#303338"/><text x="579" y="191" text-anchor="middle" class="label">l</text>
    <!-- row 3 -->
    <rect x="132" y="214" width="69" height="46" rx="8" fill="#222428"/>
    <path d="M166.5 227 l-10 11 h6 v8 h8 v-8 h6 z" fill="#E9E9EE"/>
    <rect x="207" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="229" y="243" text-anchor="middle" class="label">z</text>
    <rect x="257" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="279" y="243" text-anchor="middle" class="label">x</text>
    <rect x="307" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="329" y="243" text-anchor="middle" class="label">c</text>
    <rect x="357" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="379" y="243" text-anchor="middle" class="label">v</text>
    <rect x="407" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="429" y="243" text-anchor="middle" class="label">b</text>
    <rect x="457" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="479" y="243" text-anchor="middle" class="label">n</text>
    <rect x="507" y="214" width="44" height="46" rx="8" fill="#303338"/><text x="529" y="243" text-anchor="middle" class="label">m</text>
    <rect x="557" y="214" width="69" height="46" rx="8" fill="#222428"/>
    <path d="M579 237 l8 -8 h18 v16 h-18 z M589 233 l8 8 M597 233 l-8 8" fill="none" stroke="#E9E9EE" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- row 4 -->
    <rect x="132" y="266" width="69" height="46" rx="8" fill="#222428"/><text x="166.5" y="294" text-anchor="middle" class="mod">?123</text>
    <rect x="207" y="266" width="44" height="46" rx="8" fill="#303338"/><text x="229" y="295" text-anchor="middle" class="label">,</text>
    <rect x="257" y="266" width="244" height="46" rx="8" fill="#303338"/>
    <rect x="507" y="266" width="44" height="46" rx="8" fill="#303338"/><text x="529" y="295" text-anchor="middle" class="label">.</text>
    <rect x="557" y="266" width="69" height="46" rx="8" fill="#4C8DF6"/>
    <path d="M601 281 v8 h-18 M587 285 l-4 4 l4 4" fill="none" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 11 Navigation bar -->
  <path d="M120 372 h520 v10 a18 18 0 0 1 -18 18 h-484 a18 18 0 0 1 -18 -18 z" fill="#0B0C0F"/>
  <rect x="330" y="384" width="100" height="4" rx="2" fill="#E9E9EE" fill-opacity="0.8"/>

  <!-- Markers -->
  <g>
    <!-- 1 board: the gap left of the second row -->
    <line x1="100" y1="185" x2="140" y2="185" class="lead"/>
    <circle cx="88" cy="185" r="11" class="badge"/><text x="88" y="189" class="num">1</text>
    <!-- 2 toolbar row -->
    <line x1="100" y1="40" x2="150" y2="40" class="lead"/>
    <circle cx="88" cy="40" r="11" class="badge"/><text x="88" y="44" class="num">2</text>
    <!-- 3 suggestion strip -->
    <line x1="660" y1="80" x2="600" y2="80" class="lead"/>
    <circle cx="672" cy="80" r="11" class="badge"/><text x="672" y="84" class="num">3</text>
    <!-- 4 letter key -->
    <line x1="100" y1="133" x2="150" y2="133" class="lead"/>
    <circle cx="88" cy="133" r="11" class="badge"/><text x="88" y="137" class="num">4</text>
    <!-- 5 key hint -->
    <line x1="660" y1="118" x2="624" y2="118" class="lead"/>
    <circle cx="672" cy="118" r="11" class="badge"/><text x="672" y="122" class="num">5</text>
    <!-- 6 pressed key -->
    <line x1="279" y1="162" x2="279" y2="156" class="lead"/>
    <circle cx="279" cy="160" r="11" class="badge"/><text x="279" y="164" class="num">6</text>
    <!-- 7 key border -->
    <circle cx="429" cy="160" r="11" class="badge"/><text x="429" y="164" class="num">7</text>
    <!-- 8 modifier key -->
    <line x1="100" y1="237" x2="130" y2="237" class="lead"/>
    <circle cx="88" cy="237" r="11" class="badge"/><text x="88" y="241" class="num">8</text>
    <!-- 9 enter key -->
    <line x1="660" y1="289" x2="628" y2="289" class="lead"/>
    <circle cx="672" cy="289" r="11" class="badge"/><text x="672" y="293" class="num">9</text>
    <!-- 10 space bar -->
    <circle cx="379" cy="289" r="11" class="badge"/><text x="379" y="293" class="num">10</text>
    <!-- 11 navigation bar -->
    <line x1="660" y1="386" x2="600" y2="386" class="lead"/>
    <circle cx="672" cy="386" r="11" class="badge"/><text x="672" y="390" class="num">11</text>
    <!-- 12 corner / shape, on the p key's corner -->
    <line x1="660" y1="156" x2="630" y2="156" class="lead"/>
    <circle cx="672" cy="156" r="11" class="badge"/><text x="672" y="160" class="num">12</text>
  </g>
</svg>
