name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every channel flag off: this is the plain sideload build, so no Google
  # binary is on the compile classpath and CI never needs a Play SDK.
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Run unit tests
        # `unitTests` and not a bare testFullIntlDebugUnitTest: :app carries the
        # `languages` flavour and the library modules do not, so no single
        # flavoured task name reaches both. The aggregate in the root build
        # does.
        run: ./gradlew unitTests -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # Four jobs rather than two now that `languages` is a flavour dimension.
  # They run on separate runners at the same time, so the wall clock is what it
  # was; only the runner minutes double. The English build is here to prove the
  # localeFilters path still packages, which nothing else would catch before a
  # release was already being cut.
  assemble:
    name: Assemble ${{ matrix.capability }} ${{ matrix.language }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        capability: [full, lite]
        language: [intl, en]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Capitalised and joined: assembleFullIntlDebug, assembleLiteEnDebug.
      # AGP names the output directory the same way, minus the build type:
      # app/build/outputs/apk/fullIntl/debug/.
      - name: Assemble
        run: |
          capability='${{ matrix.capability }}'
          language='${{ matrix.language }}'
          variant="${capability}${language^}"
          # Exported because the upload step needs the same capitalisation and
          # a GitHub expression cannot produce it: joining the two matrix
          # values would spell the directory "fullintl". (No expression syntax
          # in this comment: Actions evaluates it inside run blocks too.)
          echo "VARIANT_DIR=$variant" >> "$GITHUB_ENV"
          ./gradlew "assemble${capability^}${language^}Debug" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.capability }}-${{ matrix.language }}-debug
          path: app/build/outputs/apk/${{ env.VARIANT_DIR }}/debug/*.apk
          retention-days: 7

  # ART never compiles a method of 10,000 dex instructions or more, and runs
  # one with a frame over 3 KB in its slow interpreter until the JIT gets to
  # it. Nothing else notices either: the keyboard just types slower. Reads the
  # dex of a `fast` build (release-mode d8, no R8, so the names are readable).
  # English only, because the dex is the same in both language flavours.
  dex-limits:
    name: Dex method limits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Check method sizes
        run: ./gradlew :app:checkDexMethodsFullEnFast --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-methods
          path: app/build/reports/dex-methods/
          retention-days: 7

  # Every library the APK ships, against the licences app/build.gradle.kts
  # allows. Three builds because the answer differs: full carries ML Kit under
  # Google's terms, lite does not, and an F-Droid build must carry nothing but
  # free licences, which the F-Droid flag makes the allow list enforce.
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Full and lite
        run: ./gradlew :app:licenseeAndroidFullIntlRelease :app:licenseeAndroidLiteIntlRelease --stacktrace

      - name: Lite as F-Droid builds it
        run: ./gradlew :app:licenseeAndroidLiteIntlRelease -Pwmkb.enableFdroid=true --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensee
          path: app/build/reports/licensee/
          retention-days: 7

  # Accuracy floors move when a dictionary or a ranking weight changes, which
  # is a review conversation and not a merge blocker. Reported, never gating.
  eval:
    name: Prediction & gesture evals (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Scoped to :app because that is where the eval suites live. An
      # unqualified task name would run the filter against every module too,
      # and a Test task whose --tests filter matches nothing fails the build.
      - name: Run evals
        run: >
          ./gradlew :app:testFullIntlDebugUnitTest
          --tests '*.prediction.eval.*' --tests '*.gesture.eval.*'
          -Pwmkb.skipBenchmarks=true --stacktrace

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      # CHECK_LINKS=1 turns on starlight-links-validator, so a broken internal
      # link fails here instead of shipping to Pages.
      - run: npm run check
        working-directory: docs
