[versions]
agp = "9.3.0"
kotlin = "2.2.20"
coreKtx = "1.16.0"
profileinstaller = "1.4.1"
junit = "4.13.2"
# Robolectric runs an Android runtime on the JVM, so a unit test can drive the
# real IME service instead of only its pure helpers. Latest stable; 4.17 is
# still beta, same rule as luaj and detekt.
robolectric = "4.16.1"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
# BiometricPrompt for the settings app's optional fingerprint lock. GMS-free
# and with no native code, so it needs no flavour or channel handling and is
# fine for F-Droid. 1.1.0 is the last stable line; 1.2.0 has been alpha since
# 2021, same rule as luaj and detekt below.
#
# It needs androidx.fragment — which appcompat above already puts on the
# classpath, so nothing new is dragged in. The note on playAppUpdate below is
# not a precedent against this one: there fragment bought a suspend wrapper
# around one Task, here the library's retained BiometricFragment *is* the
# mechanism that carries a prompt across a configuration change.
biometric = "1.1.0"
activityCompose = "1.10.1"
# Compose UI 1.11.4 / Material3 1.4.0. Not the newest BOM: 2026.08.00 and up
# carry compose-ui 1.12, whose aar metadata demands compileSdk 37 and would
# drag every module's compileSdk with it. 2026.06.01 is the last BOM that
# still builds against the 36 we compile with.
composeBom = "2026.06.01"
lifecycle = "2.9.0"
datastore = "1.1.7"
serializationJson = "1.8.1"
coroutines = "1.10.2"
emoji2 = "1.5.0"
autofill = "1.1.0"
navigationCompose = "2.9.0"
# material3-adaptive, for the settings app's two-pane layout on a tablet.
# Held at 1.1.0 for a year because 1.2 and up declare compose-ui 1.9.0, which
# Gradle would have resolved *up* from the 1.8.2 the BOM pinned then. The BOM
# above is past that now, so that pin is spent — but 1.3.0 is out for the same
# reason the newest BOM is: its aar metadata demands compileSdk 37. 1.2.0 asks
# for 35, so it is as far as this line goes until compileSdk moves.
composeAdaptive = "1.2.0"
mlkitDigitalInk = "19.0.0"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
mlkitTextRecognition = "16.0.1"
mlkitBarcode = "17.3.0"
# Unbundled twins of the two bundled ML Kit artifacts above, used by
# Play-channel builds only (see :feature:ime): Play services downloads the
# models on demand, so ~18 MB per ABI of pipeline .so + model assets stay out
# of the AAB. Sideload/F-Droid channels keep the bundled artifacts so scanners
# work without GMS. The version lines differ because Google numbers the
# unbundled artifacts independently of the bundled ones.
mlkitTextRecognitionUnbundled = "19.0.1"
mlkitBarcodeUnbundled = "18.3.1"
mlkitDocScanner = "16.0.0"
# Unbundled: the model is downloaded from Play services on first use, so
# nothing ships in the APK. Still beta upstream; there is no stable line.
mlkitSubjectSegmentation = "16.0.0-beta1"
camerax = "1.4.2"
# 3.5.x ships Kotlin 2.4 metadata, unreadable by this project's Kotlin 2.2.
coil = "3.2.0"
# Already in the APK as Coil's network engine; declared here so the WebDAV
# backup sink can use it directly. HttpURLConnection cannot: it validates the
# request method against a fixed list and rejects PROPFIND and MOVE outright.
okhttp = "4.12.0"
zxing = "3.5.3"
litertlm = "0.14.0"
# 2.x splits into litert + litert-api sharing one namespace, which AGP's
# manifest merger rejects; 1.4.2 is the last single-artifact classic runtime
# (org.tensorflow.lite.Interpreter + signature runners).
litert = "1.4.2"
# Lua interpreter for the plugin sandbox. Pure JVM, MIT, no transitive deps.
# 3.0.1 is the LAST version published to Maven Central — the 3.0.2 git tag was
# never released as an artifact. Do not bump without re-auditing PluginSandbox:
# it depends on interpreter internals (which exceptions pcall catches, the
# DebugLib.onInstruction hook path, the process-global LuaString.s_metatable)
# that no public API pins down.
luaj = "3.0.1"
# Play In-App Updates, the only piece of Play Core this app links. It reaches
# the APK *only* when the build is a Play-channel build
# (-Pwmkb.enablePlayStore=true) — see app/build.gradle.kts, which swaps the
# source directory as well as the dependency. 2.1.0 is the current release of
# the split-out app-update artifact; the old monolithic `play:core` is
# deprecated and must not be used. The companion `app-update-ktx` is
# deliberately absent: its whole contribution is a suspend wrapper around one
# Task, and it drags androidx.fragment into an app that has no fragments.
playAppUpdate = "2.1.0"
# SplitInstallManager + SplitCompat for the on-demand AI-runtime module.
# Play-channel builds only, same rule as app-update: a Google Play binary
# that must never reach the F-Droid or direct-download APKs.
playFeatureDelivery = "2.1.0"
playServicesAuth = "21.3.0"
# YAML, read-only, for the Espanso importer in :core:content. Espanso match
# files are real YAML — comments, block scalars, quoting rules, the occasional
# anchor — and they come from strangers on the Espanso Hub, so a hand-rolled
# subset parser would be both a bug farm and a security surface.
#
# Only the *loader* is used, always through SafeConstructor with an explicit
# LoaderOptions (code-point, alias and nesting limits). The 1.x default
# constructor instantiated arbitrary classes named in the document, which is
# CVE-2022-1471; 2.x removed that, and this app additionally never goes near
# the unsafe entry points. Writing YAML is hand-rolled in EspansoFile, so the
# emitter half shrinks away and the output keeps its block scalars and comments.
snakeyaml = "2.4"
# Static analysis. detekt 2.x is still alpha; 1.23.8 is the last stable line and
# parses this project's Kotlin fine (no context receivers / `when` guards here).
detekt = "1.23.8"
# Slack's Compose lint checks: Android Lint rules for @Composable correctness
# (unstable parameters, unremembered mutable state, modifier misuse, ...).
composeLints = "1.5.3"

[libraries]
